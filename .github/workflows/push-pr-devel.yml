name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches: [devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout dbeaver-common
        run: git clone --depth 1 --branch devel https://github.com/dbeaver/dbeaver-common.git dbeaver-common

      - name: Checkout dbeaver
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git dbeaver
          cd dbeaver
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Install dbeaver-common
        working-directory: ./dbeaver-common
        run: mvn install -DskipTests --no-transfer-progress -e 2>&1
        shell: bash

      - name: Build dbeaver CE
        working-directory: ./dbeaver
        run: |
          mvn verify -f product/aggregate/pom.xml -Pproduct-dbeaver-ce,product-dbeaver-eclipse-ce -DskipTests -e 2>&1 | tee "$GITHUB_WORKSPACE/mvn-build.log"
          rc=${PIPESTATUS[0]}
          echo "MAVEN_EXIT_CODE=$rc" >> $GITHUB_ENV
          echo "### Maven build result: exit code $rc" >> $GITHUB_STEP_SUMMARY
          if [ $rc -ne 0 -a -f "$GITHUB_WORKSPACE/mvn-build.log" ]; then
            echo "Last 100 lines of Maven log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 "$GITHUB_WORKSPACE/mvn-build.log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "Full log contains $(wc -l < "$GITHUB_WORKSPACE/mvn-build.log") lines" >> $GITHUB_STEP_SUMMARY
          fi
          exit $rc
        shell: bash

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbeaver-ce-products
          path: dbeaver/product/community/target/products/
