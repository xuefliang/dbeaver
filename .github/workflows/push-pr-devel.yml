name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches: [devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout dbeaver-common
        run: git clone --depth 1 --branch devel https://github.com/dbeaver/dbeaver-common.git dbeaver-common

      - name: Checkout dbeaver
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git dbeaver
          cd dbeaver
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Install dbeaver-common
        working-directory: ./dbeaver-common
        run: |
          mvn install -DskipTests --no-transfer-progress -e 2>&1 | tee "${{ runner.temp }}/common-build.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::group::COMMON BUILD ERROR (last 60 lines)"; tail -60 "${{ runner.temp }}/common-build.log"; echo "::endgroup::"; fi
          exit $rc
        shell: bash

      - name: Build dbeaver plugins only
        working-directory: ./dbeaver
        run: |
          mvn package -f plugins/pom.xml -DskipTests --no-transfer-progress -e 2>&1 | tee "${{ runner.temp }}/ce-build.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::group::CE BUILD ERROR (last 60 lines)"; tail -60 "${{ runner.temp }}/ce-build.log"; echo "::endgroup::"; fi
          exit $rc
        shell: bash
