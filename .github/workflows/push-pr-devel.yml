name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches: [devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout dbeaver-common
        run: git clone --depth 1 --branch devel https://github.com/dbeaver/dbeaver-common.git dbeaver-common

      - name: Checkout dbeaver
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git dbeaver
          cd dbeaver
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Install dbeaver-common (target platform)
        working-directory: ./dbeaver-common
        run: mvn install -DskipTests 2>&1 | tee "${{ runner.temp }}/common-build.log"
        shell: bash

      - name: Build dbeaver CE
        working-directory: ./dbeaver
        run: mvn package -f product/aggregate/pom.xml -Pproduct-dbeaver-ce,product-dbeaver-eclipse-ce -DskipTests 2>&1 | tee "${{ runner.temp }}/ce-build.log"
        shell: bash

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maven-build-logs
          path: |
            ${{ runner.temp }}/common-build.log
            ${{ runner.temp }}/ce-build.log
          retention-days: 1
